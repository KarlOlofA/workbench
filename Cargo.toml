[package]
name = "workbench"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
dioxus = { version = "0.7.10", features = ["desktop"] }
futures-util = "0.3.34"
html-escape = "0.3.1"
pulldown-cmark = "0.13.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rfd = "0.17"
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = "5.3.0"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "rt", "macros", "time", "net"] }
ulid = "3.0.0"
# Intent checks (PRO-222 satisfaction, PRO-223 lint) from the workbench_auditer repo, used before absorbing agent work.
workbench-check = { git = "https://github.com/KarlOlofA/workbench_auditer.git", rev = "f383a88a97401c3613c62792bd47b10ebf82d8ba" }
workbench-graph = { git = "https://github.com/KarlOlofA/workbench_auditer.git", rev = "f383a88a97401c3613c62792bd47b10ebf82d8ba" }
workbench-llm = { git = "https://github.com/KarlOlofA/workbench_auditer.git", rev = "f383a88a97401c3613c62792bd47b10ebf82d8ba" }
